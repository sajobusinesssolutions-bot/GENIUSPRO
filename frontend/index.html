<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- One family app-wide: Inter, 400–800. The deck sets headings at 730/750
         and figures at 700, so 800 has to be available or they render faux-bold. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Till, stock and double-entry books for Ugandan shops." />
    <meta name="theme-color" content="#3730A3" />
    <!-- The name in the browser tab. It said "Billing & GST"
         until v1.42: the Indian tax vocabulary this application has not used
         for a long time, sitting in the first thing anybody sees. -->
    <title>Genius POS</title>
  </head>
  <body>
    <!-- What is on the screen before React replaces it, and what stays there
         if React never arrives at all — a bundle that failed to load or would
         not parse used to leave a completely blank window with nothing to
         report. React clears this the moment it mounts. -->
    <div id="root">
      <div id="boot-note" style="font:15px/1.6 system-ui,sans-serif;max-width:32rem;margin:18vh auto;padding:0 1.5rem;color:#444">
        <div style="font-weight:700;font-size:18px;margin-bottom:6px">Genius POS is starting…</div>
        <div id="boot-slow" style="display:none">
          <p>This is taking longer than it should. The app did not finish loading.</p>
          <p style="color:#777;font-size:13.5px">
            Close this tab, stop the black window with Ctrl+C, and start it again.
            If it keeps happening, the black window and
            <code>backend\data\logs</code> will say why.
          </p>
        </div>
      </div>
    </div>
    <script>
      /* If React has not taken over in eight seconds it is not going to. */
      setTimeout(function () {
        var slow = document.getElementById("boot-slow");
        if (slow) slow.style.display = "block";
      }, 8000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
